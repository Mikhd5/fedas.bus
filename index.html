function Header() {

    <div className="header-inner container">

}

  const [form, setForm] = useState({ name: '', phone: '', from: '', date: '', passengers: '1', details: '' });
  const [requestText, setRequestText] = useState('');
  const [copied, setCopied] = useState(false);
  useEffect(() => setCountry(initialCountry || 'Німеччина'), [initialCountry]);
  useEffect(() => {
    const handler = e => setService(e.detail || 'Пасажирська поїздка');
    window.addEventListener('fedas-service', handler);
    return () => window.removeEventListener('fedas-service', handler);
  }, []);
  const update = e => setForm(old => ({ ...old, [e.target.name]: e.target.value }));
  const handleSubmit = e => {
    e.preventDefault();
    const lines = [
      'Добрий день! Хочу залишити заявку FEDAS BUS.',
      `Послуга: ${service}`,
      `Ім’я: ${form.name}`,
      `Телефон: ${form.phone}`,
      `Звідки: ${form.from || 'Не вказано'}`,
      `Напрямок: ${country}`,
      ...(service === 'Пасажирська поїздка' ? [`Кількість пасажирів: ${form.passengers}`, `Бажана дата: ${form.date || 'Уточню окремо'}`] : []),
      `Деталі: ${form.details || 'Немає додаткових побажань'}`
    ];
    setRequestText(lines.join('\n'));
    setCopied(false);
  };
  const copyRequest = async () => {
    try {
      await navigator.clipboard.writeText(requestText);
      setCopied(true);
    } catch {
      const area = document.createElement('textarea');
      area.value = requestText; document.body.appendChild(area); area.select();
      try { document.execCommand('copy'); setCopied(true); } catch { setCopied(false); }
      area.remove();
    }
  };
  const openTelegram = () => window.open(TELEGRAM, '_blank', 'noopener,noreferrer');
  return <section className="section booking" id="booking">
    <div className="container booking__layout">
      <div className="booking__intro"><SectionHeading kicker="ПОЧНІМО ЗАЯВКУ" title={<>Ваша подорож<br/><em>починається тут.</em></>} text="Залиште контактні дані та коротко опишіть запит. Ми підготуємо повідомлення, яке можна надіслати команді FEDAS BUS у Telegram."/><div className="booking__contact"><span className="booking__contact-icon"><Icon name="phone" size={20}/></span><span><small>Зателефонувати</small><a href={`tel:${PHONE_TEL}`}>{PHONE}</a></span></div><div className="booking__contact"><span className="booking__contact-icon"><Icon name="send" size={20}/></span><span><small>Написати в Telegram</small><a href={TELEGRAM} target="_blank" rel="noreferrer">@fedas_bus</a></span></div></div>
      <div className="booking-card">
        {!requestText ? <form onSubmit={handleSubmit}>
          <div className="form-top"><span>ЗАЯВКА FEDAS BUS</span><span className="form-top__line"/></div>
          <div className="field"><span>Що вас цікавить?</span><div className="service-switch"><button type="button" className={service==='Пасажирська поїздка'?'active':''} onClick={()=>setService('Пасажирська поїздка')}>Поїздка</button><button type="button" className={service==='Передача посилки'?'active':''} onClick={()=>setService('Передача посилки')}>Посилка</button></div></div>
          <div className="form-grid"><label className="field"><span>Ваше ім’я *</span><input name="name" value={form.name} onChange={update} placeholder="Як до вас звертатися" required autoComplete="name"/></label><label className="field"><span>Номер телефону *</span><input name="phone" type="tel" value={form.phone} onChange={update} placeholder="+380 ..." required autoComplete="tel"/></label></div>
          <div className="form-grid"><label className="field"><span>Звідки вирушаєте / відправляєте</span><input name="from" value={form.from} onChange={update} placeholder="Місто або населений пункт"/></label><label className="field"><span>Країна призначення *</span><select value={country} onChange={e=>setCountry(e.target.value)} required>{countries.map(c=><option key={c.code} value={c.code}>{c.flag} {c.name}</option>)}</select></label></div>
          {service === 'Пасажирська поїздка' && <div className="form-grid"><label className="field"><span>Бажана дата</span><input type="date" name="date" value={form.date} onChange={update}/></label><label className="field"><span>Кількість пасажирів</span><select name="passengers" value={form.passengers} onChange={update}>{['1','2','3','4','5','6','7','8'].map(n=><option key={n} value={n}>{n}</option>)}</select></label></div>}
          <label className="field"><span>{service === 'Передача посилки' ? 'Що потрібно передати?' : 'Коментар або додаткові побажання'}</span><textarea name="details" value={form.details} onChange={update} rows="3" placeholder={service === 'Передача посилки' ? 'Коротко опишіть посилку та її розмір' : 'Наприклад, місто прибуття або інші деталі'}/></label>
          <button className="button button--gold button--wide" type="submit">Підготувати заявку <Icon name="arrow"/></button>
          <p className="form-note">Дані не зберігаються на сайті. Ви самостійно вирішуєте, чи копіювати та надсилати підготовлене повідомлення в Telegram.</p>
        </form> : <div className="request-ready"><span className="request-ready__icon"><Icon name="check" size={24}/></span><span className="eyebrow"><span className="eyebrow__line"/> ЗАЯВКУ ПІДГОТОВЛЕНО</span><h3>Ще один крок<br/><em>до подорожі.</em></h3><p>Скопіюйте текст заявки та надішліть його команді FEDAS BUS у Telegram. Дані не надсилаються автоматично.</p><pre>{requestText}</pre><button className="button button--gold button--wide" onClick={copyRequest}><Icon name="copy" size={17}/>{copied ? 'Текст скопійовано' : 'Скопіювати заявку'}</button><button className="button button--outline-dark button--wide" onClick={openTelegram}>Відкрити Telegram <Icon name="send" size={17}/></button><button className="request-reset" onClick={()=>setRequestText('')}>Змінити дані заявки</button></div>}
      </div>
    </div>
  </section>;
}

function FAQ() {
  const questions = [
    ['Які країни доступні для поїздок?', 'Актуальні напрямки FEDAS BUS: Латвія, Литва, Естонія, Польща, Австрія та Німеччина. Міста та деталі конкретного рейсу уточнюйте у перевізника.'],
    ['Як дізнатися вартість квитка?', 'Залиште заявку або зв’яжіться з командою телефоном чи в Telegram. Вартість залежить від маршруту та деталей поїздки.'],
    ['Чи входить багаж у вартість?', 'Так, згідно з актуальною інформацією FEDAS BUS, багаж входить у вартість поїздки. Допустимі розміри та кількість багажу варто уточнити під час бронювання.'
    ],
    ['Чи можна передати посилку?', 'Так, у профілі FEDAS BUS зазначена послуга передачі посилок. Напишіть, звідки й куди потрібно передати відправлення, щоб уточнити умови.'],
    ['Як часто відправляються автобуси?', 'За актуальною інформацією FEDAS BUS, рейси відправляються щодня. Точний час, місце посадки та наявність місць уточнюйте перед бронюванням.']
  ];
  const [active, setActive] = useState(0);
  return <section className="section faq"><div className="container faq__layout"><SectionHeading kicker="КОРОТКО ПРО ГОЛОВНЕ" title={<>Питання, які<br/><em>виникають найчастіше.</em></>} text="Не знайшли відповіді? Напишіть нам — команда допоможе уточнити деталі."/><div className="faq-list">{questions.map(([q,a],i)=><div className={`faq-item ${active===i?'faq-item--active':''}`} key={q}><button onClick={()=>setActive(active===i?-1:i)} aria-expanded={active===i}><span className="faq-item__number">0{i+1}</span><b>{q}</b><span className="faq-item__toggle">{active===i?'−':'+'}</span></button>{active===i&&<p>{a}</p>}</div>)}</div></div></section>;
}

function Footer() {
  return <footer className="footer" id="contacts"><div className="container"><div className="footer__main"><div className="footer__brand"><Logo/><p>Подорожуйте з комфортом<br/>та безпекою.</p></div><div className="footer__column"><span className="footer__title">НАВІГАЦІЯ</span><a href="#destinations">Напрямки</a><a href="#comfort">Комфорт</a><a href="#fleet">Автопарк</a><a href="#parcels">Передача посилок</a></div><div className="footer__column"><span className="footer__title">ЗВ’ЯЗОК</span><a href={`tel:${PHONE_TEL}`}>{PHONE}</a><a href={TELEGRAM} target="_blank" rel="noreferrer">Telegram: @fedas_bus</a><a href={INSTAGRAM} target="_blank" rel="noreferrer">Instagram: @fedas.bus</a><span>Viber: {PHONE}</span></div><div className="footer__cta"><span className="eyebrow"><span className="eyebrow__line"/> FEDAS BUS</span><h3>До зустрічі<br/><em>в дорозі.</em></h3><a className="button button--gold" href="#booking">Залишити заявку <Icon name="arrow"/></a></div></div><div className="footer__bottom"><span>© {new Date().getFullYear()} FEDAS BUS. Усі права захищені.</span><span>COMFORT <i>•</i> SAFETY <i>•</i> EUROPE</span><a href="#top">НАГОРУ ↑</a></div></div></footer>;
}

function App() {
  const [selectedCountry, setSelectedCountry] = useState('Німеччина');
  const chooseCountry = name => {
    setSelectedCountry(name);
    document.getElementById('booking')?.scrollIntoView({ behavior: 'smooth' });
  };
  return <>
    <Hero/>
    <IntroStrip/>
    <DestinationSection selectedCountry={selectedCountry} onChoose={chooseCountry}/>
    <ComfortSection/>
    <SafetySection/>
    <FleetSection/>
    <ParcelSection/>
    <BookingSection initialCountry={selectedCountry}/>
    <FAQ/>
    <Footer/>
    <a className="floating-contact" href={TELEGRAM} target="_blank" rel="noreferrer" aria-label="Написати FEDAS BUS у Telegram"><Icon name="send" size={21}/><span>Написати нам</span></a>
    <div className="mobile-quickbar"><a href={`tel:${PHONE_TEL}`}><Icon name="phone" size={19}/> Зателефонувати</a><a href="#booking"><Icon name="arrow" size={19}/> Заявка</a></div>
  </>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<React.StrictMode><App/></React.StrictMode>);

  </script>
</body>
</html>
